<!DOCTYPE html>
<html lang="en">
<head>
    <script
	src="https://challenges.cloudflare.com/turnstile/v0/api.js"
	async
	defer
></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QauntumBoa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        
        body:not(.touch-device),
        body:not(.touch-device) * {
            cursor: url('assets/cursor.cur') 0 1, auto !important;
        }

        @media (pointer: coarse) {
            body:not(.touch-device),
            body:not(.touch-device) *,
            body.touch-device,
            body.touch-device * {
                cursor: auto !important;
            }
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            position: relative;
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .hidden {
            display: none !important;
        }

        
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-icon {
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            color: white;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        
        .transparency-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .transparency-icon {
            width: 20px;
            height: 20px;
            color: white;
        }

        
        .top-controls {
            position: fixed;
            bottom: calc(50% - 240px - 60px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .song-switcher {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 46px;
            max-width: min(250px, calc(100vw - 24px));
            padding: 7px 12px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            text-align: left;
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .song-switcher:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 206, 209, 0.55);
            background: rgba(0, 0, 0, 0.88);
        }

        .song-switcher:active,
        .social-link:active {
            transform: scale(0.96);
        }

        #volume-icon:active {
            transform: scale(0.92);
        }

        .song-switcher:focus-visible {
            outline: 2px solid #B7A1F7;
            outline-offset: 3px;
        }

        .song-switcher-icon {
            width: 20px;
            height: 20px;
            flex: 0 0 auto;
            color: #B7A1F7;
        }

        .song-switcher-copy {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 2px;
        }

        .song-switcher-label {
            color: #fff;
            font-size: 9px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .song-switcher-title {
            overflow: hidden;
            max-width: 165px;
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .song-switcher-next {
            margin-left: 4px;
            color: #fff;
            font-size: 11px;
        }

        .click-burst {
            position: fixed;
            z-index: 9998;
            pointer-events: none;
        }

        .click-burst-particle {
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #A855F7;
            box-shadow: 0 0 7px rgba(168, 85, 247, 0.7);
            animation: click-particle 420ms ease-out forwards;
        }

        @keyframes click-particle {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            18% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(
                    calc(-50% + var(--particle-x)),
                    calc(-50% + var(--particle-y))
                ) scale(0.2);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .click-burst {
                display: none;
            }
        }

        
        #profile-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 820px;
            min-height: 332px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out;
            pointer-events: auto;
        }

        #profile-network {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0.7;
            z-index: 0;
        }

        #profile-block > :not(#profile-network):not(.profile-signal):not(.visitor-counter) {
            position: relative;
            z-index: 2;
        }

        .profile-signal {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: inherit;
            pointer-events: none;
            z-index: 1;
        }

        .profile-signal::before,
        .profile-signal::after {
            content: '';
            position: absolute;
            left: -5%;
            width: 110%;
            height: 12px;
            opacity: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(168, 85, 247, 0.08) 12%,
                rgba(196, 181, 253, 0.3) 42%,
                rgba(168, 85, 247, 0.18) 68%,
                transparent 92%
            );
        }

        .profile-signal::before {
            top: 28%;
            animation: signal-tear 9s infinite;
        }

        .profile-signal::after {
            top: 72%;
            height: 7px;
            animation: signal-tear 12s 3.5s infinite;
        }

        @keyframes signal-tear {
            0%, 94%, 100% {
                opacity: 0;
                transform: translateX(0);
            }
            94.2% {
                opacity: 0.55;
                transform: translateX(-8px);
            }
            94.45% {
                opacity: 0.25;
                transform: translateX(5px);
            }
            94.7% {
                opacity: 0;
                transform: translateX(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .profile-signal::before,
            .profile-signal::after {
                animation: none;
                display: none;
            }
        }

        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .profile-container {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .profile-container::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: radial-gradient(
                circle at 10px 10px,
                var(--primary-color, #B7A1F7) 10%,
                transparent 15%
            );
            animation: orbit 3s linear infinite;
            z-index: -1;
            filter: blur(1px);
            box-shadow: none;
        }

        .profile-container.fast-orbit::after {
            animation: fast-orbit 0.5s linear forwards;
        }

        .profile-picture {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .name-and-badges {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        
        @font-face {
            font-family: 'Angel Wish';
            src: url('assets/Angel_wish.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        #profile-name {
            font-family: 'Angel Wish', sans-serif;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #fff;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            opacity: 1 !important;
        }

        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge-container {
            position: relative;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .badge-container .tooltip {
            visibility: hidden;
            width: 120px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 100;
            bottom: 125%;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .badge-container:hover .tooltip {
            visibility: visible;
            opacity: 1 !important;
        }

        .badge-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px;
            border-radius: 15px;
            display: inline-block;
        }

        .badge-box-inner {
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 12px;
            display: flex;
            gap: 8px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .badge {
            width: 22px;
            height: 22px;
            transition: transform 0.3s;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .badge:hover {
            transform: scale(1.2);
        }

        #profile-bio {
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 10px;
            opacity: 1 !important;
        }

        .bio-separator {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 20px 0;
            opacity: 1 !important;
        }

        .profile-footer {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr) 110px;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-top: auto;
        }

        .other-info-link {
            grid-column: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 42px;
            padding: 7px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 11px;
            line-height: 1.2;
            text-align: center;
            text-decoration: none;
            backdrop-filter: blur(8px);
        }

        .other-info-link:hover {
            border-color: rgba(255, 255, 255, 0.38);
            background: rgba(255, 255, 255, 0.16);
        }

        .other-info-link:focus-visible {
            outline: 2px solid #B7A1F7;
            outline-offset: 3px;
        }

        .other-info-icon {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
            color: #B7A1F7;
        }

        .tryhackme-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            grid-column: 2;
            max-width: 100%;
            overflow: hidden;
        }

        .tryhackme-badge iframe,
        .tryhackme-badge img {
            max-width: 100%;
            pointer-events: none;
        }

        .visitor-counter {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 9px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 30;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .visitor-icon {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
            color: #fff;
        }

        .visitor-count-label {
            color: #fff;
            font-size: 12px;
        }

        .visitor-count-badge {
            display: block;
            width: auto;
            height: 22px;
            border-radius: 8px;
        }

        .visitor-counter .tooltip {
            visibility: hidden;
            width: 120px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 100;
            top: -35px;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .visitor-counter:hover .tooltip {
            visibility: visible;
            opacity: 1 !important;
        }

        .social-links {
            display: flex;
            justify-content: center;
            grid-column: 3;
            gap: 8px;
            margin-top: 0;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            text-decoration: none;
            backdrop-filter: blur(8px);
        }

        .social-link:hover {
            border-color: rgba(255, 255, 255, 0.38);
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-3px);
        }

        .social-icon {
            width: 26px;
            height: 26px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            pointer-events: auto;
            opacity: 1 !important;
        }

        .social-icon:hover {
            transform: scale(1.4) rotateY(15deg);
        }

        
        
        
        .glitch {
            animation: glitch 0.2s ease-in-out;
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
            }
            20% {
                transform: translate(-2px, 2px);
            }
            40% {
                transform: translate(-2px, -2px);
            }
            60% {
                transform: translate(2px, 2px);
            }
            80% {
                transform: translate(2px, -2px);
            }
            100% {
                transform: translate(0);
            }
        }

        @keyframes orbit {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fast-orbit {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        
        .cursor-trail {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }

        .cursor-trail-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
            overflow: hidden;
        }

        #start-ambience {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            opacity: 0.95;
            transition: opacity 0.45s ease;
        }

        #start-screen > .profile-signal {
            z-index: 31;
            background: none;
        }

        #start-text {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            color: #fff;
            text-align: center;
            position: relative;
            z-index: 32;
            text-shadow: 0 0 12px rgba(0, 206, 209, 0.35);
        }

        
        @media (max-width: 430px) {
            
            #profile-block {
                width: 90vw;
                max-width: 350px;
                min-height: 280px;
                padding: 15px;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }

            .profile-header {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .profile-container {
                width: 120px;
                height: 120px;
            }

            .profile-picture {
                width: 120px;
                height: 120px;
            }

            .profile-info {
                align-items: center;
                text-align: center;
            }

            .name-and-badges {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            #profile-name {
                font-size: 24px;
                letter-spacing: 2px;
            }

            .badge-group {
                justify-content: center;
                gap: 6px;
            }

            .badge {
                width: 18px;
                height: 18px;
            }

            .badge-container .tooltip {
                width: 100px;
                font-size: 12px;
                margin-left: -50px;
                bottom: 110%;
            }

            #profile-bio {
                font-size: 14px;
                line-height: 1.4;
            }

            .bio-separator {
                margin: 15px 0;
            }

            .social-links {
                gap: 10px;
                justify-content: center;
            }

            .profile-footer {
                grid-template-columns: 1fr;
                justify-content: center;
            }

            .tryhackme-badge {
                order: -1;
                grid-column: 1;
                grid-row: 1;
                margin-bottom: 4px;
            }

            .social-links {
                grid-column: 1;
                grid-row: 2;
            }

            .other-info-link {
                grid-column: 1;
                grid-row: 3;
                justify-self: center;
                width: min(100%, 150px);
            }

            .social-icon {
                width: 32px;
                height: 32px;
            }

            .visitor-counter {
                align-self: center;
            }

            .visitor-count-badge {
                height: 22px;
            }

            .visitor-icon {
                width: 14px;
                height: 14px;
            }

            .visitor-counter .tooltip {
                width: 100px;
                font-size: 12px;
                margin-left: -50px;
                top: -30px;
            }

            .top-controls {
                bottom: 70px;
                gap: 10px;
                padding: 6px 10px;
            }

            .volume-control, .transparency-control {
                gap: 6px;
            }

            .volume-icon, .transparency-icon {
                width: 18px;
                height: 18px;
            }

            .slider {
                width: 60px;
                height: 4px;
            }

            .slider::-webkit-slider-thumb {
                width: 10px;
                height: 10px;
            }

            
            
            #start-text {
                font-size: 18px;
                padding: 0 20px;
            }
        }

        @media (max-width: 600px) {
            #profile-block {
                top: calc(50% - 28px);
                width: calc(100vw - 20px);
                max-width: 460px;
                min-height: 0;
                max-height: calc(100dvh - 100px);
                overflow-y: auto;
                overscroll-behavior: contain;
                padding: 56px 14px 16px;
                gap: 12px;
            }

            .visitor-counter {
                top: 8px;
                right: 8px;
            }

            .top-controls {
                bottom: max(10px, env(safe-area-inset-bottom));
                max-width: calc(100vw - 20px);
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                z-index: 40;
            }

            .song-switcher {
                left: 10px;
                bottom: max(64px, calc(env(safe-area-inset-bottom) + 54px));
            }

            .volume-icon,
            .transparency-icon {
                width: 24px;
                height: 24px;
            }

            .social-link {
                width: 44px;
                height: 44px;
            }
        }

        @media (max-height: 520px) and (max-width: 900px) {
            #profile-block {
                top: 10px;
                width: calc(100vw - 20px);
                max-width: 820px;
                transform: translateX(-50%);
                max-height: calc(100dvh - 84px);
                padding-top: 48px;
            }

            .profile-header {
                flex-direction: row;
                align-items: center;
            }

            .profile-container,
            .profile-picture {
                width: 80px;
                height: 80px;
            }

            .profile-info {
                align-items: flex-start;
                text-align: left;
            }

            .name-and-badges {
                align-items: flex-start;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Retro+Gaming&display=swap" rel="stylesheet">
</head>
<body onload="initMedia()">
    <div id="start-screen">
        <canvas id="start-ambience" aria-hidden="true"></canvas>
        <div class="profile-signal" aria-hidden="true"></div>
        <div id="start-text">Click me to enter</div>
    </div>

    <div class="container">
        
        <video id="background" autoplay loop muted playsinline webkit-playsinline>
            <source src="assets/youtube-video.mp4" type="video/mp4">
        </video>
        <audio id="background-music" src="assets/h8swag%20-%20stop%20the%20h8.mp3" preload="auto" loop></audio>

        
        <div class="glitch-overlay"></div>
        <div id="profile-block">
            <canvas id="profile-network" aria-hidden="true"></canvas>
            <div class="profile-signal" aria-hidden="true"></div>
            <div class="visitor-counter">
